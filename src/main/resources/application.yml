spring:
  application:
    name: ai-gamified-career-platform
  datasource:
    url: jdbc:h2:mem:gamingplatform;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-migration-naming: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    org.springframework.web: INFO

app:
  security:
    legacy-claim-secret: ${APP_LEGACY_CLAIM_SECRET:}
  debug:
    enabled: ${APP_DEBUG_ENABLED:false}
  ai:
    provider: ${APP_AI_PROVIDER:local}
    langchain4j:
      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:}
        model-name: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: ${OPENAI_TEMPERATURE:0.2}
        timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
        max-retries: ${OPENAI_MAX_RETRIES:1}
        log-requests: ${OPENAI_LOG_REQUESTS:false}
        log-responses: ${OPENAI_LOG_RESPONSES:false}
  usage:
    requests-per-minute: ${APP_REQUESTS_PER_MINUTE:120}
    ai-requests-per-day: ${APP_AI_REQUESTS_PER_DAY:50}
  submissions:
    recovery-interval-ms: ${APP_SUBMISSION_RECOVERY_INTERVAL_MS:300000}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
